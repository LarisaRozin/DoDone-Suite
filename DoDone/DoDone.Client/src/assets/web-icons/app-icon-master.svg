<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="checkmarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="jewelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#64B5F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="smallShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200" fill="url(#backgroundGradient)" />
  
  <!-- Main checkmark circle - the hero element with subtle depth -->
  <circle cx="512" cy="512" r="330" fill="#ffffff" opacity="0.3" />
  <circle cx="512" cy="512" r="320" fill="#ffffff" filter="url(#shadow)" />
  <circle cx="512" cy="512" r="280" fill="url(#checkmarkGradient)" />
  
  <!-- Inner subtle highlight on checkmark circle -->
  <circle cx="512" cy="512" r="280" fill="none" stroke="#81C784" stroke-width="4" opacity="0.6" />
  
  <!-- Clean, bold checkmark with layered depth -->
  <!-- Shadow layer for depth -->
  <path d="M422 514 L482 574 L606 450" stroke="rgba(0,0,0,0.2)" stroke-width="54" 
        fill="none" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Main checkmark with thicker stroke and rounded ends -->
  <path d="M420 512 L480 572 L604 448" stroke="#ffffff" stroke-width="56" 
        fill="none" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Inner highlight for extra pop -->
  <path d="M420 512 L480 572 L604 448" stroke="rgba(255,255,255,0.6)" stroke-width="32" 
        fill="none" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- More distinctive dollar coin with border and shadow -->
  <circle cx="720" cy="304" r="72" fill="#ffffff" filter="url(#smallShadow)" />
  <circle cx="720" cy="304" r="64" fill="url(#coinGradient)" />
  <circle cx="720" cy="304" r="64" fill="none" stroke="#E65100" stroke-width="3" />
  <text x="720" y="322" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="52" font-weight="bold" fill="#E65100">$</text>
  
  <!-- Jewel/bonus indicator - diamond shape using theme blue -->
  <g transform="translate(304, 720)">
    <circle r="72" fill="#ffffff" filter="url(#smallShadow)" />
    <circle r="64" fill="url(#jewelGradient)" />
    <path d="M0,-40 L28,-12 L0,40 L-28,-12 Z" fill="#64B5F6" />
    <path d="M0,-30 L20,-8 L0,30 L-20,-8 Z" fill="#ffffff" opacity="0.3" />
    <circle r="64" fill="none" stroke="#0D47A1" stroke-width="3" />
  </g>
</svg>