displayName: "Cloud Run High Request Latency (p95 >2s)"
conditions:
  - displayName: "95th percentile latency too high"
    conditionThreshold:
      filter: 'metric.type="run.googleapis.com/request_latencies" resource.type="cloud_run_revision"'
      comparison: COMPARISON_GT
      thresholdValue: 2000
      duration: 300s
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_DELTA
          crossSeriesReducer: REDUCE_PERCENTILE_95
          groupByFields:
            - resource.service_name
combiner: OR
notificationChannels:
  - projects/dodone-mobile/notificationChannels/72047322645513936
alertStrategy:
  autoClose: 3600s
documentation:
  content: "API response time is slow. Check for slow database queries or external service issues."
  mimeType: text/markdown
