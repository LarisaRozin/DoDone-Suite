displayName: "Cloud Run 5xx Server Errors"
conditions:
  - displayName: "High rate of 5xx errors"
    conditionThreshold:
      filter: 'metric.type="run.googleapis.com/request_count" resource.type="cloud_run_revision" metric.label.response_code_class="5xx"'
      comparison: COMPARISON_GT
      thresholdValue: 5
      duration: 300s
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_RATE
combiner: OR
notificationChannels:
  - projects/dodone-mobile/notificationChannels/72047322645513936
alertStrategy:
  autoClose: 1800s
documentation:
  content: "Server errors detected. Check Cloud Run logs for stack traces and errors."
  mimeType: text/markdown
