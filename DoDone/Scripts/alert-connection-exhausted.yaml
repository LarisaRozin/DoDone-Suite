displayName: "PostgreSQL Connection Slots Exhausted"
conditions:
  - displayName: "Connection exhaustion detected"
    conditionThreshold:
      filter: 'metric.type="logging.googleapis.com/user/connection_slots_exhausted" resource.type="cloudsql_database"'
      comparison: COMPARISON_GT
      thresholdValue: 0
      duration: 60s
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_RATE
combiner: OR
notificationChannels:
  - projects/dodone-mobile/notificationChannels/72047322645513936
alertStrategy:
  autoClose: 86400s
